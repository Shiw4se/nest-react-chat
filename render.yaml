# Render Blueprint: backend (Docker web service) + frontend (static site).
# Database: Neon (free Postgres). File storage: Cloudflare R2 (S3-compatible).
# Step-by-step guide: docs/DEPLOY.md. Values marked `sync: false` are asked
# for when the Blueprint is created.
services:
  - type: web
    name: chat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon connection string, with ?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://chat-frontend.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO
        value: "true"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false # https://pub-xxxx.r2.dev or your custom domain

  - type: web
    name: chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://chat-backend.onrender.com
      - key: VITE_WS_URL
        sync: false # same as VITE_API_URL
      - key: VITE_DEMO_ACCOUNTS
        value: demo,alex,maria
      - key: VITE_DEMO_PASSWORD
        value: Demo1234
