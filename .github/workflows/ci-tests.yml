name: "CI - Lint, Build & Test"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "Lint, build and unit tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Lint Backend
        run: cd backend && npx eslint "{src,test}/**/*.ts"

      - name: Build Backend
        run: cd backend && npm run build

      - name: Run Backend tests
        run: cd backend && npm test

      - name: Run Backend e2e tests
        run: cd backend && npm run test:e2e

      - name: Install Frontend dependencies
        run: cd frontend && npm ci

      - name: Lint Frontend
        run: cd frontend && npm run lint

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Run Frontend tests
        run: cd frontend && npm test

  browser:
    name: "Browser tests (Playwright)"
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat
      JWT_SECRET: ci-e2e-secret
      FRONTEND_URL: http://localhost:5173
      # The suite registers and logs in users quickly; production keeps 5/min
      AUTH_THROTTLE_LIMIT: "1000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Prepare backend (install, migrate, build)
        run: |
          cd backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Install frontend
        run: cd frontend && npm ci

      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts the API and the Vite dev server itself
      - name: Run browser tests
        run: cd e2e && npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
