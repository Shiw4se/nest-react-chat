name: Claude PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          show_full_output: true
          allowed_tools: "Bash,Read,Write,Edit,ToolSearch,WebFetch"
          prompt: |
            You are an expert software engineer. Please review this pull request.
            1. Focus on identifying bugs, security vulnerabilities, and anti-patterns.
            2. Check if the code follows the architecture rules.
            3. Do not nitpick small formatting issues.
            4. Use the GitHub review tools to leave inline comments on specific lines of code where you find issues.
            5. After leaving inline comments, post a summary comment with an overall assessment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
